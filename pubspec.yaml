name: connector
description: "A new Flutter project."
publish_to: "none"

version: 1.0.8+9

environment:
  sdk: ^3.12.0
  flutter: 3.44.0

dependencies:
  flutter:
    sdk: flutter
  flutter_launcher_icons: 0.14.4
  flutter_localizations:
    sdk: flutter
  horizon:
    git:
      url: https://github.com/Assessli-tech/horizon-flutter.git
      ref: main

dependency_overrides:
  device_info_plus: 13.1.0

dev_dependencies:
  flutter_lints: 6.0.0
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/images/app_icon/
    - assets/languages/
    - shorebird.yaml
